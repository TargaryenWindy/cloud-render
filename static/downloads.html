<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Download videos · Render desk</title><style>body{font:16px/1.6 Segoe UI,sans-serif;background:#101416;color:#edf3ee;max-width:750px;margin:50px auto;padding:24px}button,a{color:#bcf478}button{background:#303a34;border:0;padding:12px;border-radius:8px;cursor:pointer}li{margin:15px 0}p{color:#aab7ae}</style><h1>Download videos individually</h1><p>Your batch is below the ZIP threshold. Download each video below, or start all downloads. Your browser may ask you to allow multiple downloads.</p><button id="all" disabled>Download all files</button><ul id="files"></ul><a href="/">Back to render desk</a><p id="error"></p><script>
let links=[];fetch('/api/downloads').then(async r=>{if(!r.ok)throw Error('Sign in to render desk first.');return r.json()}).then(data=>{for(const file of data.files){const li=document.createElement('li'),a=document.createElement('a');a.href=file.url;a.download='';a.textContent=file.name;li.append(a);document.getElementById('files').append(li);links.push(a)}document.getElementById('all').disabled=!links.length}).catch(e=>document.getElementById('error').textContent=e.message);document.getElementById('all').onclick=async()=>{for(const a of links){a.click();await new Promise(resolve=>setTimeout(resolve,700))}};
</script></html>
